<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1b1f">
<title>4265 Auto Replay</title>
<style>
  :root {
    --surface: #1c1b1f; --surface-1: #232227; --surface-2: #2b2930;
    --outline: #49454f; --on-surface: #e6e1e5; --on-surface-dim: #cac4d0;
    --primary: #d0bcff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body {
    margin: 0; background: var(--surface); color: var(--on-surface);
    font: 15px/1.55 ui-sans-serif, system-ui, Roboto, "Segoe UI", sans-serif;
    padding: max(24px, env(safe-area-inset-top)) 20px calc(120px + env(safe-area-inset-bottom));
    max-width: 860px; margin: 0 auto;
  }
  header h1 { font-size: 22px; margin: 0 0 4px; }
  header p { margin: 0 0 4px; color: var(--on-surface-dim); font-size: 14px; }
  .hint { color: var(--on-surface-dim); font-size: 13px; opacity: .85; margin-bottom: 18px; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
  .card {
    display: flex; align-items: center; gap: 12px; padding: 14px;
    background: var(--surface-1); border: 2px solid var(--outline); border-radius: 12px;
    cursor: pointer; user-select: none; transition: border-color .12s, background .12s;
  }
  .card:hover { background: var(--surface-2); }
  .card.sel { border-color: var(--accent); background: #2a2733; }
  .card .dot { width: 20px; height: 20px; border-radius: 6px; flex: none; }
  .card .body { flex: 1; min-width: 0; }
  .card .num { font-weight: 700; font-size: 16px; }
  .card .name { color: var(--on-surface-dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta { font-size: 12px; color: var(--on-surface-dim); margin-top: 2px; }
  .card .check {
    width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--outline); flex: none;
    display: grid; place-items: center; font-size: 14px; color: var(--surface);
  }
  .card.sel .check { background: var(--accent); border-color: var(--accent); }
  .card.sel .check::after { content: "✓"; font-weight: 900; }
  .card .num { white-space: nowrap; }
  .card.home .num::after { content: " · you"; font-weight: 400; font-size: 11px; color: var(--primary); }

  .card.disabled { cursor: not-allowed; opacity: .55; }
  .card.disabled:hover { background: var(--surface-1); }
  .card.disabled .check { visibility: hidden; }
  .card .why { font-size: 11px; color: #e3a08a; margin-top: 3px; }

  .card .alone {
    font-size: 11px; color: var(--primary); text-decoration: none; padding: 6px 8px;
    border: 1px solid var(--outline); border-radius: 8px; flex: none;
  }
  .card .alone:hover { background: var(--surface); }

  #bar {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 14px 20px calc(14px + env(safe-area-inset-bottom));
    background: rgba(28,27,31,.94); border-top: 1px solid var(--outline);
    display: flex; align-items: center; gap: 14px; justify-content: center;
    backdrop-filter: blur(6px);
  }
  #count { color: var(--on-surface-dim); font-size: 13px; }
  #go {
    background: var(--primary); color: #381e72; border: 0; border-radius: 22px;
    padding: 12px 26px; font-weight: 800; font-size: 15px; cursor: pointer; min-height: 46px;
  }
  #go:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>
<header>
  <h1>4265 Auto Replay</h1>
  <p>Pick the teams you want, then play their autos together on one field to check for collisions.</p>
  <div class="hint">An FRC alliance is three teams. Tap a card to add it; tap “view alone” to see just that team.</div>
</header>

<div id="grid"></div>

<div id="bar">
  <span id="count">0 teams</span>
  <button id="go" disabled>Replay together →</button>
</div>

<script>
const selected = new Set();

fetch('teams.json').then(r => r.json()).then(m => {
  const grid = document.getElementById('grid');
  // available teams first (by number), unavailable last
  const teams = m.teams.slice().sort((a, b) =>
    (!!a.unavailable - !!b.unavailable) || a.num - b.num);

  teams.forEach(async team => {
    const card = document.createElement('div');
    card.className = 'card' + (team.home ? ' home' : '') + (team.unavailable ? ' disabled' : '');
    card.style.setProperty('--accent', team.color);

    let count = '';
    if (team.file) {
      try {
        const d = await fetch(team.file).then(r => r.json());
        const n = d.autos.filter(a => !a.error).length;
        count = `${n} auto${n === 1 ? '' : 's'}`;
      } catch { count = 'data error'; }
    }

    card.innerHTML = `
      <span class="dot" style="background:${team.color}"></span>
      <div class="body">
        <div class="num">${team.num}</div>
        <div class="name">${team.name}</div>
        ${team.unavailable ? `<div class="why">${team.unavailable}</div>` : `<div class="meta">${count}</div>`}
      </div>
      ${team.file ? `<a class="alone" href="single.html?team=${team.num}">view alone</a>` : ''}
      <div class="check"></div>`;

    if (!team.unavailable && team.file) {
      card.onclick = e => {
        if (e.target.closest('.alone')) return;   // let the link work
        card.classList.toggle('sel');
        card.classList.contains('sel') ? selected.add(team.num) : selected.delete(team.num);
        updateBar();
      };
      // preselect your own team
      if (team.home) { card.classList.add('sel'); selected.add(team.num); }
    }
    grid.appendChild(card);
    updateBar();
  });
});

function updateBar() {
  const n = selected.size;
  document.getElementById('count').textContent = `${n} team${n === 1 ? '' : 's'} selected`;
  const go = document.getElementById('go');
  go.disabled = n < 1;
  go.textContent = n >= 2 ? 'Replay together →' : (n === 1 ? 'Need one more to compare →' : 'Pick teams →');
  go.disabled = n < 2;
}

document.getElementById('go').onclick = () => {
  if (selected.size < 2) return;
  const csv = [...selected].sort((a, b) => a - b).join(',');
  location.href = 'alliance.html?teams=' + csv;
};
</script>
</body>
</html>
